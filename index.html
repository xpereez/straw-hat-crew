<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Straw Hat Log</title>
  <style>
    :root { --ink: #1f2933; --muted: #5f6b7a; --paper: #fdf8ef; --accent: #c8102e; --line: #e8dfcf; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: var(--paper); line-height: 1.6; }
    header { text-align: center; padding: 3rem 1rem 2rem; border-bottom: 3px double var(--line); }
    header h1 { margin: 0; font-size: 2.4rem; }
    header p { margin: .5rem 0 0; color: var(--muted); font-style: italic; }
    main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-bottom: 2rem; }
    nav a { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: .25rem .75rem; background: #fff; }
    nav a:hover, nav a:focus { background: var(--accent); color: #fff; }
    article { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    article h2 { margin: 0; font-size: 1.5rem; }
    .meta { font-family: system-ui, sans-serif; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: .25rem 0 1rem; }
    .tag { display: inline-block; background: var(--paper); border-radius: 4px; padding: .1rem .5rem; margin-right: .35rem; }
    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 2rem 1rem; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>The Straw Hat Log</h1>
    <p>Entries about every member of Monkey D. Luffy's crew</p>
  </header>
  <main>
    <nav id="toc" aria-label="Crew members"></nav>
    <section id="posts"></section>
  </main>
  <footer>A fan blog about One Piece. Characters belong to Eiichiro Oda.</footer>
  <script>
    const crew = [
      { id: "luffy", name: "Monkey D. Luffy", role: "Captain", origin: "East Blue", text: "The rubber-bodied captain who ate the Gomu Gomu no Mi. His dream is to find the One Piece and become King of the Pirates, and he values his friends above everything else." },
      { id: "zoro", name: "Roronoa Zoro", role: "Swordsman", origin: "East Blue", text: "Master of the three-sword style and the first to join Luffy. He wants to become the world's greatest swordsman, even if he gets lost on the way to every destination." },
      { id: "nami", name: "Nami", role: "Navigator", origin: "East Blue", text: "A brilliant navigator who reads the weather like a book. She fights with the Clima-Tact and dreams of drawing a map of the entire world." },
      { id: "usopp", name: "Usopp", role: "Sniper", origin: "East Blue", text: "A master of slingshots and tall tales. He is often scared, but he keeps standing up for his friends on his way to becoming a brave warrior of the sea." },
      { id: "sanji", name: "Vinsmoke Sanji", role: "Cook", origin: "North Blue", text: "The crew's chef, who fights only with his legs to protect his cooking hands. He is searching for the All Blue, the sea where fish from every ocean meet." },
      { id: "chopper", name: "Tony Tony Chopper", role: "Doctor", origin: "Drum Island", text: "A reindeer who ate the Hito Hito no Mi. He is the crew's doctor and wants to cure every disease in the world." },
      { id: "robin", name: "Nico Robin", role: "Archaeologist", origin: "West Blue", text: "The only person able to read the Poneglyphs. With the Hana Hana no Mi she can sprout limbs anywhere, and she seeks the true history of the world." },
      { id: "franky", name: "Franky", role: "Shipwright", origin: "South Blue", text: "A cyborg shipwright who built the Thousand Sunny. He dreams of sailing a ship he made to the end of the Grand Line." },
      { id: "brook", name: "Brook", role: "Musician", origin: "West Blue", text: "A living skeleton brought back by the Yomi Yomi no Mi. The crew's musician and swordsman, he wants to keep a promise to his old friend Laboon." },
      { id: "jinbe", name: "Jinbe", role: "Helmsman", origin: "Fish-Man Island", text: "A fish-man karate master and former Warlord of the Sea. He steers the Thousand Sunny with the calm of someone who knows every current." }
    ];
    document.getElementById("toc").innerHTML = crew.map(m => `<a href="#${m.id}">${m.name}</a>`).join("");
    document.getElementById("posts").innerHTML = crew.map((m, i) => `
      <article id="${m.id}">
        <h2>${m.name}</h2>
        <div class="meta">Entry ${i + 1} <span class="tag">${m.role}</span><span class="tag">${m.origin}</span></div>
        <p>${m.text}</p>
      </article>`).join("");
  </script>
</body>
</html>
